worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Gzip compression for fast global asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream litchess_oracle {
        server oracle:8080;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static Frontend SPA
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Zero-Trust WebSocket Oracle Proxy (/ws -> ws://oracle:8080)
        location /ws {
            proxy_pass http://litchess_oracle;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Keep WebSocket connections alive during long Rapid matches
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}