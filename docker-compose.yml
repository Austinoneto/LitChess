services:
  oracle:
    build: .
    container_name: litchess-oracle
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TRUST_PROXY=true
      - RPC_URL=${RPC_URL:-https://liteforge.rpc.caldera.xyz/http}
      - SERVER_PRIVATE_KEY=${SERVER_PRIVATE_KEY}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS:-0xcFb8464caB423ceCD4EB82CD0bdFC244A2546EdF}
      - USERNAME_REGISTRY_ADDRESS=${USERNAME_REGISTRY_ADDRESS:-0x7ff44d488B5e75adF4ba35B9fbAca68ce9BE92AE}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    volumes:
      - litchess_data:/usr/src/app/data
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"

  web:
    image: nginx:1.27-alpine
    container_name: litchess-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./public:/usr/share/nginx/html/public:ro
    depends_on:
      - oracle

volumes:
  litchess_data: